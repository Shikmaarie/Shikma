<title>דפי הנחיתה של רחלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&display=swap">
<style>
:root{
  direction:rtl;
  --ground:#f2f4f3;
  --surface:#ffffff;
  --surface-2:#e9edec;
  --ink:#0c2125;
  --ink-2:#4d6569;
  --ink-3:#7d9296;
  --line:#dae1e0;
  --line-strong:#bfcccb;
  --teal:#0f4a50;
  --teal-2:#14606a;
  --teal-soft:#dde9e8;
  --on-teal:#f4f7f6;
  --gold:#8a6a2f;
  --gold-2:#b08850;
  --gold-soft:#f4ead7;
  --ok:#2c7a55;   --ok-soft:#dcece3;
  --warn:#9c6715; --warn-soft:#f6ecd9;
  --danger:#a2483f; --danger-soft:#f7e3e0;
  --shadow:0 1px 2px rgba(12,33,37,.05), 0 10px 26px -16px rgba(12,33,37,.35);
  --shadow-lg:0 24px 60px -24px rgba(12,33,37,.45);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061a1d;
    --surface:#0b262a;
    --surface-2:#0f3339;
    --ink:#e9e2d7;
    --ink-2:#a5babb;
    --ink-3:#7a9294;
    --line:#16404890;
    --line-strong:#1f5560;
    --teal:#7cc9c3;
    --teal-2:#85c9bc;
    --teal-soft:#0e363c;
    --on-teal:#04171a;
    --gold:#d3a96a;
    --gold-2:#edd4a2;
    --gold-soft:#332a17;
    --ok:#6ec39a;   --ok-soft:#0f3327;
    --warn:#e0b567; --warn-soft:#382c15;
    --danger:#f5877b; --danger-soft:#41211d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
    --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#061a1d;
  --surface:#0b262a;
  --surface-2:#0f3339;
  --ink:#e9e2d7;
  --ink-2:#a5babb;
  --ink-3:#7a9294;
  --line:#16404890;
  --line-strong:#1f5560;
  --teal:#7cc9c3;
  --teal-2:#85c9bc;
  --teal-soft:#0e363c;
  --on-teal:#04171a;
  --gold:#d3a96a;
  --gold-2:#edd4a2;
  --gold-soft:#332a17;
  --ok:#6ec39a;   --ok-soft:#0f3327;
  --warn:#e0b567; --warn-soft:#382c15;
  --danger:#f5877b; --danger-soft:#41211d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Heebo",system-ui,"Segoe UI",sans-serif;
  font-weight:400;
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
}
h1,h2,h3{font-family:"Frank Ruhl Libre","Frank Ruhl Libre",Georgia,serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-2);text-decoration-color:color-mix(in srgb,var(--teal-2) 40%,transparent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px;border-radius:4px}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.nums{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);
  border-block-end:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:6px}
.brand svg{width:19px;height:19px;flex:none;color:var(--gold-2)}
.brand b{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:17px;font-weight:700;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:12px;white-space:nowrap;padding-inline-start:9px;border-inline-start:1px solid var(--line-strong)}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{
  width:100%;padding:8px 34px 8px 12px;border:1px solid var(--line-strong);
  border-radius:var(--r);background:var(--surface);
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.spacer{flex:1}
.who{
  display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;
  border:1px solid var(--line);border-radius:99px;background:var(--surface);
  cursor:pointer;font-size:13px;color:var(--ink-2);
}
.who .av{
  width:24px;height:24px;border-radius:99px;display:grid;place-items:center;
  background:var(--teal-soft);color:var(--teal-2);font-size:11px;font-weight:700;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;
  transition:background .13s ease,border-color .13s ease,transform .13s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-pri{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn-pri:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--danger-soft)}

/* ---------- notices ---------- */
.notice{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 16px;font-size:13px;line-height:1.5;
  border-block-end:1px solid var(--line);
  background:var(--warn-soft);color:var(--ink);
}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--warn)}
.notice[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start;min-height:calc(100vh - 58px)}
.rail{
  border-inline-start:1px solid var(--line);
  background:var(--surface);
  position:sticky;top:58px;
  height:calc(100vh - 58px);display:flex;flex-direction:column;
}
.rail-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-block-end:1px solid var(--line)}
.rail-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rail-title h2{font-size:15px}
.rail-title em{font-style:normal;font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  padding:3px 9px;border-radius:99px;border:1px solid var(--line-strong);
  background:transparent;font-size:12px;cursor:pointer;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.rail-list{overflow-y:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:4px}

.pagerow{
  display:grid;grid-template-columns:3px 1fr auto;gap:10px;align-items:center;
  padding:9px 10px;border-radius:var(--r);cursor:pointer;text-align:start;
  border:1px solid transparent;background:transparent;width:100%;
}
.pagerow:hover{background:var(--surface-2)}
.pagerow[aria-current="true"]{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal-2) 30%,transparent)}
.pagerow .stripe{align-self:stretch;border-radius:99px;background:var(--line-strong)}
.pagerow.s-live .stripe{background:var(--ok)}
.pagerow.s-draft .stripe{background:var(--ink-3)}
.pagerow.s-review .stripe{background:var(--warn)}
.pagerow.s-paused .stripe{background:var(--danger)}
.pagerow.s-archived .stripe{background:var(--line-strong)}
.pagerow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagerow .sub{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagerow .cnt{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}

/* ---------- detail ---------- */
.detail{padding:22px 26px 60px;min-width:0}
.dossier-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-block-end:18px}
.dossier-head h1{font-size:27px;line-height:1.2}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-block-end:5px}
.head-actions{display:flex;gap:7px;flex-wrap:wrap}

.links{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-block-end:18px;
}
.linkcell{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.linkcell .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.linkcell .lbl svg{width:13px;height:13px}
.linkcell .val{display:flex;align-items:center;gap:8px;min-width:0}
.linkcell a{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.linkcell .none{color:var(--ink-3);font-size:13.5px;font-style:italic}
.icobtn{
  border:none;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;
  border-radius:6px;display:grid;place-items:center;flex:none;
}
.icobtn:hover{background:var(--surface-2);color:var(--ink)}
.icobtn svg{width:14px;height:14px}

.notes{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-block-end:20px;font-size:14px;color:var(--ink-2);
  white-space:pre-wrap;max-width:68ch;
}

.tabs{display:flex;gap:2px;border-block-end:1px solid var(--line);margin-block-end:16px;flex-wrap:wrap;align-items:flex-end}
.tab{
  padding:8px 13px;border:none;background:transparent;cursor:pointer;
  font-size:14px;color:var(--ink-2);border-block-end:2px solid transparent;margin-block-end:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-block-end-color:var(--teal-2);font-weight:500}
.tab .n{font-size:12px;color:var(--ink-3);padding-inline-start:5px}
.tabs .spacer{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;text-align:start;
  cursor:pointer;padding:0;transition:box-shadow .15s ease,border-color .15s ease;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.thumb{
  aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;
  position:relative;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .placeholder{color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px}
.thumb .placeholder svg{width:22px;height:22px}
.card-body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body .ttl{font-size:13.5px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:auto}

.pill{
  font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;
  border:1px solid transparent;white-space:nowrap;
}
.pill-live{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pill-draft{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-strong)}
.pill-review{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill-approved{background:var(--teal-soft);color:var(--teal-2);border-color:color-mix(in srgb,var(--teal-2) 30%,transparent)}
.pill-paused{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.pill-archived{background:transparent;color:var(--ink-3);border-color:var(--line-strong)}
.pill-plain{background:transparent;color:var(--ink-3);border-color:var(--line)}

.drop{
  border:1.5px dashed var(--line-strong);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  color:var(--ink-3);font-size:13px;cursor:pointer;background:transparent;
  aspect-ratio:1;padding:14px;text-align:center;transition:border-color .15s,background .15s,color .15s;
}
.drop:hover,.drop.over{border-color:var(--teal-2);color:var(--teal-2);background:var(--teal-soft)}
.drop svg{width:23px;height:23px}
.drop small{font-size:11.5px;opacity:.85;line-height:1.4}

.empty{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:44px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty svg.star{width:26px;height:26px;color:var(--gold-2)}
.empty h2{font-size:20px}
.empty p{color:var(--ink-2);max-width:44ch;font-size:14px}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#04171a 62%,transparent);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 18px;overflow-y:auto;
}
.scrim[hidden]{display:none!important}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);width:100%;max-width:560px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-block-end:1px solid var(--line)}
.modal-head h2{font-size:18px}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.modal-foot{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-block-start:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--ground);
}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* ---------- lightbox ---------- */
.lb{max-width:1040px;width:100%}
.lb-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,.85fr)}
.lb-stage{
  background:var(--surface-2);display:grid;place-items:center;padding:16px;min-height:300px;
  border-inline-end:1px solid var(--line);
}
.lb-stage img{max-width:100%;max-height:66vh;object-fit:contain;display:block;border-radius:4px}
.lb-stage .msg{color:var(--ink-3);font-size:13px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.lb-stage .msg svg{width:26px;height:26px}
.lb-side{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kv{display:flex;flex-direction:column;gap:3px}
.kv dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.kv dd{margin:0;font-size:14px;word-break:break-word}
.copybox{
  background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:13.5px;white-space:pre-wrap;max-height:180px;overflow-y:auto;line-height:1.55;
}
.lb-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* ---------- toast ---------- */
.toast{
  position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(50%) translateY(12px);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;
  font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:var(--shadow-lg);max-width:min(90vw,460px);text-align:center;
}
.toast.on{opacity:1;transform:translateX(50%) translateY(0)}

.backlink{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;max-height:none;border-inline-start:none;border-block-end:1px solid var(--line)}
  .rail-list{max-height:46vh}
  .shell.viewing .rail{display:none}
  .shell:not(.viewing) .detail{display:none}
  .backlink{display:inline-flex}
  .detail{padding:18px 16px 50px}
  .lb-grid{grid-template-columns:1fr}
  .lb-stage{border-inline-end:none;border-block-end:1px solid var(--line)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></symbol>

<script>
(function () {
  "use strict";
  document.documentElement.setAttribute("dir", "rtl");
  document.documentElement.setAttribute("lang", "he");

  /* ---------------- vocabulary ---------------- */
  var PAGE_STATUS = { draft: "טיוטה", review: "בבדיקה", live: "באוויר", paused: "מושהה", archived: "בארכיון" };
  var CRE_STATUS  = { draft: "טיוטה", review: "בבדיקה", approved: "מאושר", live: "באוויר", paused: "מושהה" };
  var KIND        = { ad: "עיצוב לממומן", lp: "צילום דף הנחיתה", thanks: "צילום דף התודה" };
  var KIND_SHORT  = { ad: "ממומן", lp: "דף הנחיתה", thanks: "דף תודה" };
  var THUMB_BUDGET = 34000;   /* data-URI characters kept on the creative record */
  var FULL_BUDGET  = 200000;  /* data-URI characters kept on the preview record */

  /* ---------------- tiny helpers ---------------- */
  var NAME_SAFE = /[^\w\u0590-\u05ff\- ]+/g;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }
  function nowISO() { return new Date().toISOString(); }
  function when(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("he-IL", { day: "numeric", month: "short", year: "numeric" });
  }
  function host(url) {
    try { return new URL(url).host.replace(/^www\./, "") + new URL(url).pathname.replace(/\/$/, ""); }
    catch (e) { return url; }
  }
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2600);
  }
  function copy(text, label) {
    var done = function () { toast((label || "הועתק") + " הועתק"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { toast("ההעתקה נחסמה בדפדפן"); });
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("ההעתקה נחסמה בדפדפן"); }
    document.body.removeChild(ta);
  }
  function dbMessage(err) {
    var code = err && err.code;
    if (code === "quota_exceeded") return "המאגר מלא. מחקי דפים או עיצובים ישנים ונסי שוב.";
    if (code === "invalid_argument") return "השמירה נדחתה — כנראה שהקובץ גדול מדי אחרי הדחיסה.";
    if (code === "resource_exhausted") return "יותר מדי פעולות ברצף. שנייה, ונסי שוב.";
    if (code === "revoked" || code === "not_granted") return "הגישה למאגר נסגרה. רענני את העמוד.";
    return "השמירה נכשלה. נסי שוב.";
  }

  /* ---------------- state ---------------- */
  var state = {
    db: null,
    demo: false,
    ready: false,
    pages: [],
    creatives: [],
    selected: null,
    filter: "all",
    query: "",
    tab: "all",
    me: "",
    editingPage: null,
    editingCreative: null,
    pendingFiles: []
  };

  try { state.me = localStorage.getItem("lpm.me") || ""; } catch (e) { state.me = ""; }

  /* ---------------- storage layer ---------------- */
  function pagesRef() { return state.db.collection("pages"); }
  function creativesRef() { return state.db.collection("creatives"); }

  function putPage(page) {
    if (state.demo) {
      var i = state.pages.findIndex(function (p) { return p.id === page.id; });
      if (i >= 0) state.pages[i] = page; else state.pages.push(page);
      renderAll();
      return Promise.resolve();
    }
    return state.db.doc("pages/" + page.id).set(page);
  }
  function putCreative(cre, full) {
    if (state.demo) {
      var i = state.creatives.findIndex(function (c) { return c.id === cre.id; });
      if (i >= 0) state.creatives[i] = cre; else state.creatives.push(cre);
      if (full) demoPreviews[cre.id] = full;
      renderAll();
      return Promise.resolve();
    }
    var p = state.db.doc("creatives/" + cre.id).set(cre);
    if (!full) return p;
    return p.then(function () { return state.db.doc("previews/" + cre.id).set({ full: full }); });
  }
  function dropCreative(id) {
    if (state.demo) {
      state.creatives = state.creatives.filter(function (c) { return c.id !== id; });
      delete demoPreviews[id];
      renderAll();
      return Promise.resolve();
    }
    return state.db.doc("creatives/" + id).delete()
      .then(function () { return state.db.doc("previews/" + id).delete().catch(function () {}); });
  }
  function dropPage(id) {
    var kids = state.creatives.filter(function (c) { return c.pageId === id; });
    if (state.demo) {
      state.pages = state.pages.filter(function (p) { return p.id !== id; });
      state.creatives = state.creatives.filter(function (c) { return c.pageId !== id; });
      renderAll();
      return Promise.resolve();
    }
    return Promise.all(kids.map(function (c) { return dropCreative(c.id); }))
      .then(function () { return state.db.doc("pages/" + id).delete(); });
  }
  var demoPreviews = {};
  function getPreview(id) {
    if (state.demo) return Promise.resolve(demoPreviews[id] || null);
    return state.db.doc("previews/" + id).get().then(function (snap) {
      return snap.exists ? (snap.data().full || null) : null;
    }).catch(function () { return null; });
  }

  /* ---------------- image encoding ---------------- */
  function loadImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); res(img); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("הקובץ אינו תמונה שאפשר לקרוא")); };
      img.src = url;
    });
  }
  function encode(img, maxDim, budget) {
    var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    var q = 0.82, out = null;
    for (var i = 0; i < 9; i++) {
      var w = Math.max(1, Math.round(img.naturalWidth * scale));
      var h = Math.max(1, Math.round(img.naturalHeight * scale));
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      out = c.toDataURL("image/jpeg", q);
      if (out.length <= budget) return out;
      if (q > 0.5) q -= 0.11; else scale *= 0.82;
    }
    return out;
  }

  /* ---------------- derived views ---------------- */
  function visiblePages() {
    var q = state.query.trim().toLowerCase();
    return state.pages.filter(function (p) {
      if (state.filter !== "all" && p.status !== state.filter) return false;
      if (!q) return true;
      var hay = [p.name, p.campaign, (p.tags || []).join(" "), p.url, p.thankYouUrl].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    }).sort(function (a, b) {
      return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
    });
  }
  function creativesOf(pageId) {
    return state.creatives.filter(function (c) { return c.pageId === pageId; })
      .sort(function (a, b) { return String(a.createdAt || "").localeCompare(String(b.createdAt || "")); });
  }
  function pageById(id) {
    for (var i = 0; i < state.pages.length; i++) if (state.pages[i].id === id) return state.pages[i];
    return null;
  }
  function creativeById(id) {
    for (var i = 0; i < state.creatives.length; i++) if (state.creatives[i].id === id) return state.creatives[i];
    return null;
  }

  /* ---------------- rendering ---------------- */
  function pill(kind, label) { return '<span class="pill pill-' + kind + '">' + esc(label) + "</span>"; }

  function renderRail() {
    var list = visiblePages();
    $("pageCount").textContent = list.length === state.pages.length
      ? state.pages.length + " דפים"
      : list.length + " מתוך " + state.pages.length;

    if (!list.length) {
      $("railList").innerHTML = '<p style="padding:22px 12px;color:var(--ink-3);font-size:13px;text-align:center">' +
        (state.pages.length ? "אין דף שמתאים לסינון." : "עוד אין דפים כאן.") + "</p>";
      return;
    }
    $("railList").innerHTML = list.map(function (p) {
      var kids = creativesOf(p.id);
      var live = kids.filter(function (c) { return c.status === "live"; }).length;
      return '<button class="pagerow s-' + esc(p.status) + '" data-page="' + esc(p.id) + '"' +
        (state.selected === p.id ? ' aria-current="true"' : "") + ">" +
        '<span class="stripe"></span>' +
        "<span style=\"min-width:0\">" +
          '<span class="nm">' + esc(p.name) + "</span><br>" +
          '<span class="sub">' + esc(p.campaign || PAGE_STATUS[p.status] || "") + "</span>" +
        "</span>" +
        '<span class="cnt nums">' + kids.length + (live ? " · " + live + " באוויר" : "") + "</span>" +
        "</button>";
    }).join("");
  }

  function linkCell(icon, label, url, emptyText) {
    if (!url) {
      return '<div class="linkcell"><span class="lbl"><svg aria-hidden="true"><use href="#i-' + icon + '"/></svg>' +
        esc(label) + '</span><span class="none">' + esc(emptyText) + "</span></div>";
    }
    return '<div class="linkcell"><span class="lbl"><svg aria-hidden="true"><use href="#i-' + icon + '"/></svg>' +
      esc(label) + '</span><span class="val">' +
      '<a class="ltr" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(host(url)) + "</a>" +
      '<button class="icobtn" data-copy="' + esc(url) + '" data-copylabel="' + esc(label) + '" title="העתקת הכתובת" aria-label="העתקת הכתובת של ' + esc(label) + '"><svg aria-hidden="true"><use href="#i-copy"/></svg></button>' +
      '<a class="icobtn" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" title="פתיחה בלשונית חדשה" aria-label="פתיחת ' + esc(label) + '"><svg aria-hidden="true"><use href="#i-ext"/></svg></a>' +
      "</span></div>";
  }

  function creativeCard(c) {
    var img = c.thumb
      ? '<img src="' + c.thumb + '" alt="' + esc(c.title || KIND_SHORT[c.kind] || "עיצוב") + '" loading="lazy">'
      : '<span class="placeholder"><svg aria-hidden="true"><use href="#i-link"/></svg>קישור בלבד</span>';
    var meta = [];
    meta.push(pill(c.status || "draft", CRE_STATUS[c.status] || "טיוטה"));
    if (c.platform) meta.push(pill("plain", c.platform));
    if (c.format) meta.push(pill("plain", c.format));

  function requireName() {

  function savePageFromForm(e) {
    e.preventDefault();
    var existing = state.editingPage;
    var page = {
      id: existing ? existing.id : uid(),
      name: $("f-name").value.trim(),
      campaign: $("f-campaign").value.trim(),
      status: $("f-status").value,
      url: $("f-url").value.trim(),

      notes: $("f-notes").value.trim(),
      createdAt: existing ? existing.createdAt : nowISO(),

    };

    putPage(page).then(function () {

  function saveCreativeFromForm(e) {
    e.preventDefault();
    var base = {
      kind: $("c-kind").value,
      status: $("c-status").value,
      platform: $("c-platform").value,
      format: $("c-format").value,
      title: $("c-title").value.trim(),
      copy: $("c-copy").value.trim(),
      sourceUrl: $("c-src").value.trim()
    };

    if (state.editingCreative) {
      var c = state.editingCreative;
      var merged = Object.assign({}, c, base, { updatedAt: nowISO(), updatedBy: state.me });
      putCreative(merged, null).then(function () {
        close("creativeScrim");
        toast("העיצוב עודכן");
        if (!$("lbScrim").hidden) openLightbox(c.id);
      }, function (err) { toast(dbMessage(err)); });
      return;
    }

    var files = state.pendingFiles.slice();
    var picked = $("c-file").files;
    if (!files.length && picked && picked.length) files = Array.prototype.slice.call(picked);

    if (!files.length) {
      if (!base.sourceUrl && !base.title) { toast("צריך קובץ, קישור או לפחות שם"); return; }
      saveOne(null, base, 0, 1);
      return;
    }
    files.forEach(function (f, i) { saveOne(f, base, i, files.length); });
  }

  var savingCount = 0;
  function saveOne(file, base, index, total) {
    var pageId = state.selected;
    var record = Object.assign({}, base, {
      id: uid(),
      pageId: pageId,
      title: base.title ? (total > 1 ? base.title + " " + (index + 1) : base.title) : (file ? file.name.replace(/\.[^.]+$/, "") : ""),
      thumb: "",
      originalW: 0,
      originalH: 0,
      createdAt: new Date(Date.now() + index).toISOString(),
      createdBy: state.me,
      updatedAt: nowISO(),
      updatedBy: state.me,
      addedBy: state.me
    });

    close("creativeScrim");
    state.pendingFiles = [];

    var work = file
      ? loadImage(file).then(function (img) {
          record.originalW = img.naturalWidth;
          record.originalH = img.naturalHeight;
          record.thumb = encode(img, 360, THUMB_BUDGET);
          return encode(img, 1500, FULL_BUDGET);
        })
      : Promise.resolve(null);

    savingCount++;
    if (file) toast(total > 1 ? "מעלה " + total + " עיצובים…" : "מעלה את העיצוב…");

    work.then(function (full) {
      return putCreative(record, full);
    }).then(function () {
      savingCount--;
      if (savingCount === 0) toast(total > 1 ? total + " עיצובים נוספו" : "העיצוב נוסף");
    }, function (err) {
      savingCount--;
      toast(err && err.code ? dbMessage(err) : (err.message || "ההעלאה נכשלה"));
    });
  }

  function handleFiles(list) {
    if (!state.selected) { toast("בחרי קודם דף נחיתה"); return; }
    if (!requireName()) return;
    var files = Array.prototype.slice.call(list).filter(function (f) { return /^image\//.test(f.type); });
    if (!files.length) { toast("אפשר להעלות תמונות בלבד"); return; }
    openCreativeModal(null, files);
  }

  function dataUriToBlob(uri) {
    var parts = String(uri).split(",");
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
    var bin = atob(parts[1] || "");
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }
  function download(id) {
    var c = creativeById(id);
    if (!c || !c.thumb) return;
    if (!window.claude || !claude.use) { toast("\u05d4\u05d4\u05d5\u05e8\u05d3\u05d4 \u05d0\u05d9\u05e0\u05d4 \u05d6\u05de\u05d9\u05e0\u05d4 \u05db\u05d0\u05df"); return; }
    var name = (c.title || "creative").replace(NAME_SAFE, "").trim() || "creative";
    Promise.all([getPreview(id), claude.use("downloads")]).then(function (r) {
      var d = r[1];
      if (!d) { toast("\u05d4\u05d4\u05d5\u05e8\u05d3\u05d4 \u05d0\u05d9\u05e0\u05d4 \u05d6\u05de\u05d9\u05e0\u05d4 \u05db\u05d0\u05df"); return; }
      return d.save({ filename: name + ".jpg", data: dataUriToBlob(r[0] || c.thumb) })
        .then(function () { toast("\u05e0\u05e9\u05de\u05e8"); }, function (err) {
          toast(err && err.code === "declined" ? "\u05d4\u05d4\u05d5\u05e8\u05d3\u05d4 \u05d1\u05d5\u05d8\u05dc\u05d4" : "\u05d4\u05d4\u05d5\u05e8\u05d3\u05d4 \u05e0\u05db\u05e9\u05dc\u05d4");
        });
    });
  }

    if (copyBtn) { copy(copyBtn.dataset.copy, copyBtn.dataset.copylabel); return; }
    var tab = e.target.closest("[data-tab]");
    if (tab) { state.tab = tab.dataset.tab; renderDetail(); return; }
    var card = e.target.closest("[data-creative]");
    if (card) { openLightbox(card.dataset.creative); return; }
    if (e.target.closest("#dropzone")) { if (requireName()) $("c-file2").click(); return; }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var a = act.dataset.act;
    if (a === "new-page") { if (requireName()) openPageModal(null); }
    else if (a === "seed") { if (requireName()) seed(); }
    else if (a === "edit-page") { if (requireName()) openPageModal(pageById(state.selected)); }
    else if (a === "new-creative") { if (requireName()) openCreativeModal(null, []); }
    else if (a === "back") { $("shell").classList.remove("viewing"); }
  });

    var act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "edit-creative") { if (requireName()) openCreativeModal(creativeById(act.dataset.id), []); }
    if (act.dataset.act === "download") download(act.dataset.id);
  });

  $("pageForm").addEventListener("submit", savePageFromForm);
  $("creativeForm").addEventListener("submit", saveCreativeFromForm);

  $("deletePage").addEventListener("click", function () {
    var p = state.editingPage;
    if (!p) return;
    var n = creativesOf(p.id).length;
    if (!confirm("למחוק את „" + p.name + "”" + (n ? " ואת " + n + " העיצובים שלו" : "") + "? אי אפשר לשחזר.")) return;
    dropPage(p.id).then(function () {
      if (state.selected === p.id) { state.selected = null; $("shell").classList.remove("viewing"); }
      close("pageScrim"); toast("הדף נמחק");
    }, function (err) { toast(dbMessage(err)); });
  });

  $("deleteCreative").addEventListener("click", function () {
    var c = state.editingCreative;
    if (!c) return;
    if (!confirm("למחוק את העיצוב הזה?")) return;
    dropCreative(c.id).then(function () {
      close("creativeScrim"); close("lbScrim"); toast("העיצוב נמחק");
    }, function (err) { toast(dbMessage(err)); });
  });

  $("whoBtn").addEventListener("click", function () {
    $("w-name").value = state.me;
    open("whoScrim");
    setTimeout(function () { $("w-name").focus(); }, 30);
  });
  $("whoForm").addEventListener("submit", function (e) {
    e.preventDefault();
    state.me = $("w-name").value.trim();
    try { localStorage.setItem("lpm.me", state.me); } catch (err) {}
    $("whoName").textContent = state.me || "מי את/ה?";
    $("whoAv").textContent = initials(state.me);
    close("whoScrim");
  });

  document.addEventListener("click", function (e) {
    var c = e.target.closest("[data-close]");
    if (c) close(c.dataset.close);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".scrim"), function (s) {
    s.addEventListener("mousedown", function (e) { if (e.target === s) s.hidden = true; });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var openScrim = document.querySelector(".scrim:not([hidden])");
    if (openScrim) openScrim.hidden = true;
  });

  /* hidden file input shared by the dropzone */
  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "image/*";
  picker.multiple = true;
  picker.id = "c-file2";
  picker.style.display = "none";
  document.body.appendChild(picker);
  picker.addEventListener("change", function () { if (picker.files.length) handleFiles(picker.files); picker.value = ""; });

  ["dragenter", "dragover"].forEach(function (ev) {
    $("detail").addEventListener(ev, function (e) {
      if (!state.selected) return;
      e.preventDefault();
      var dz = $("dropzone");
      if (dz) dz.classList.add("over");
    });
  });
  $("detail").addEventListener("dragleave", function (e) {
    if (e.target.closest("#dropzone")) e.target.closest("#dropzone").classList.remove("over");
  });
  $("detail").addEventListener("drop", function (e) {
    if (!state.selected) return;
    e.preventDefault();
    var dz = $("dropzone");
    if (dz) dz.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  document.addEventListener("paste", function (e) {
    if (!state.selected) return;
    if (document.querySelector(".scrim:not([hidden])")) return;
    var items = e.clipboardData && e.clipboardData.files;
    if (items && items.length) handleFiles(items);
  });

  /* ---------------- boot ---------------- */
  $("whoName").textContent = state.me || "מי את/ה?";
  $("whoAv").textContent = initials(state.me);

  function startDemo(reason) {
    state.demo = true;
    state.ready = true;
    state.pages = samplePages(true);
    state.creatives = sampleCreatives(state.pages, true);
    state.selected = state.pages[0].id;
    $("bannerText").innerHTML = esc(reason) + " הנתונים שלמטה הם דוגמאות, והשינויים כאן לא נשמרים.";
    $("banner").hidden = false;
    renderAll();
  }

  renderAll();

  if (!window.claude || !claude.use) {
    startDemo("העמוד רץ מחוץ ל־Claude, בלי מאגר משותף.");
  } else {
    claude.use("db").then(function (db) {
      if (!db) { startDemo("אין גישה למאגר המשותף בתצוגה הזאת."); return; }
      state.db = db;
      db.collection("pages").onSnapshot(function (snap) {
        state.pages = snap.docs.map(function (d) {
          var o = d.data(); o.id = d.id; return o;
        });
        state.ready = true;
        if (state.selected && !pageById(state.selected)) state.selected = null;
        renderAll();
      }, function (err) { toast(dbMessage(err)); });
      db.collection("creatives").onSnapshot(function (snap) {
        state.creatives = snap.docs.map(function (d) {
          var o = d.data(); o.id = d.id; return o;
        });
        renderAll();
      }, function (err) { toast(dbMessage(err)); });
    }, function () { startDemo("אין גישה למאגר המשותף בתצוגה הזאת."); });
  }
})();
</script>
